<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f4f4"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>English with Tanya</title>
<style>
:root{--bg:#f2f2f2;--card:#fff;--text:#17191e;--muted:#777b84;--line:#e5e6e8;--dark:#222731;--shadow:0 14px 40px #191c2314}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:linear-gradient(#fafafa,#f0f0f0);color:var(--text)}button{font:inherit}.app{max-width:880px;margin:auto;padding:18px 14px 80px}.header{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 16px}.brand{display:flex;gap:12px;align-items:center;font-weight:900}.mark{width:44px;height:44px;border-radius:14px;background:var(--dark);color:#fff;display:grid;place-items:center}.install{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}.hero,.card,.progress{background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow)}.hero{padding:24px}h1{font-size:clamp(36px,8vw,58px);margin:0 0 8px}.muted{color:var(--muted)}.progress{margin-top:14px;padding:16px}.row{display:flex;justify-content:space-between;font-weight:850}.track{height:10px;background:#ececee;border-radius:99px;overflow:hidden;margin-top:10px}.bar{height:100%;background:var(--dark);width:0}.days{display:flex;gap:8px;overflow:auto;margin:14px 0}.daybtn{min-width:98px;border:1px solid var(--line);background:#fff;border-radius:15px;padding:11px;text-align:left}.daybtn.active{background:#eceeef}.daybtn.done::after{content:"✓";float:right}.lesson{display:none}.lesson.active{display:block}.card{padding:20px;margin-bottom:14px}.meta{display:flex;justify-content:space-between;gap:10px}.pill{background:#f1f1f1;border-radius:99px;padding:7px 10px;color:var(--muted);font-size:13px;font-weight:800}.step{display:none}.step.active{display:block}.wordcard{min-height:570px;text-align:center;display:flex;flex-direction:column;justify-content:space-between}.dots{display:flex;justify-content:center;gap:7px}.dot{width:28px;height:6px;border-radius:99px;background:#e6e6e6}.dot.active{background:#777}.sticker{width:180px;height:180px;margin:20px auto 8px;border-radius:38px;background:#f2f2f2;border:3px solid #222;display:grid;place-items:center;font-size:78px;transform:rotate(-2deg);box-shadow:0 12px 22px #0001}.en{font-size:44px;font-weight:950}.ru{font-size:22px;color:var(--muted)}.example{border-top:1px solid var(--line);margin-top:20px;padding-top:18px}.buttons{display:flex;gap:10px;justify-content:center}.primary,.secondary,.unknown{padding:13px 17px;border-radius:14px;font-weight:850}.primary{border:0;background:var(--dark);color:#fff}.secondary{border:1px solid var(--dark);background:#fff}.unknown{border:1px dashed #999;background:#fafafa;color:#666}.phrase,.quiz,.finish,.gpt{display:none}.phrase.active,.quiz.active,.finish.active,.gpt.active{display:block}.phrasebox{font-size:28px;font-weight:900;background:#f3f3f3;border-radius:22px;padding:28px;text-align:center;margin:30px 0}.qtitle{font-size:24px;font-weight:900}.options{display:grid;gap:10px}.opt{border:1px solid var(--line);background:#fff;padding:14px;border-radius:14px;text-align:left}.opt.correct{background:#edf7f1;border-color:#78a88e}.opt.wrong{background:#fff0f0;border-color:#c77}.finish{text-align:center}.check{width:100px;height:100px;border-radius:50%;background:var(--dark);color:white;display:grid;place-items:center;font-size:48px;margin:20px auto}
@media(max-width:600px){.wordcard{min-height:620px}.sticker{width:160px;height:160px}.en{font-size:39px}}
</style></head><body><main class="app"><header class="header"><div class="brand"><div class="mark">EN</div><div>English<br>with Tanya</div></div><button class="install" id="install">⬇️</button></header><section class="hero"><h1 id="dayTitle">День 1</h1><div class="muted">4 слова · 1 фраза · мини-тест</div></section><section class="progress"><div class="row"><span>Прогресс курса</span><span id="pct">0%</span></div><div class="track"><div class="bar" id="bar"></div></div></section><nav class="days" id="days"></nav><section id="lessons"></section></main>
<script>
const DAYS=[{"day": 1, "title": "Начинаем уверенно", "words": [{"en": "reliable", "ru": "надёжный", "icon": "🤝", "type": "general"}, {"en": "actually", "ru": "на самом деле", "icon": "✦", "type": "general"}, {"en": "timeline", "ru": "таймлайн", "icon": "▥", "type": "editing"}, {"en": "footage", "ru": "исходный материал", "icon": "🎞", "type": "editing"}], "phrase": "To be honest, I prefer this version.", "gpt": false}, {"day": 2, "title": "Монтаж и выбор", "words": [{"en": "prefer", "ru": "предпочитать", "icon": "♡", "type": "general"}, {"en": "instead", "ru": "вместо этого", "icon": "⇄", "type": "general"}, {"en": "transition", "ru": "переход", "icon": "⇢", "type": "editing"}, {"en": "trim", "ru": "обрезать", "icon": "✂", "type": "editing"}], "phrase": "This shot works better.", "gpt": false}, {"day": 3, "title": "Сроки и работа", "words": [{"en": "manage", "ru": "справляться", "icon": "✓", "type": "general"}, {"en": "probably", "ru": "вероятно", "icon": "☁", "type": "general"}, {"en": "deadline", "ru": "срок сдачи", "icon": "▦", "type": "editing"}, {"en": "revision", "ru": "правка", "icon": "✎", "type": "editing"}], "phrase": "The deadline is quite tight.", "gpt": true}, {"day": 4, "title": "Правки клиента", "words": [{"en": "clarify", "ru": "уточнить", "icon": "?", "type": "general"}, {"en": "specific", "ru": "конкретный", "icon": "◎", "type": "general"}, {"en": "feedback", "ru": "обратная связь", "icon": "◌", "type": "editing"}, {"en": "draft", "ru": "черновик", "icon": "▤", "type": "editing"}], "phrase": "I can make that change.", "gpt": false}, {"day": 5, "title": "Объясняем решения", "words": [{"en": "reason", "ru": "причина", "icon": "☼", "type": "general"}, {"en": "effective", "ru": "эффективный", "icon": "ϟ", "type": "general"}, {"en": "pacing", "ru": "темп монтажа", "icon": "»", "type": "editing"}, {"en": "sequence", "ru": "последовательность кадров", "icon": "▥", "type": "editing"}], "phrase": "This works better because...", "gpt": false}, {"day": 6, "title": "Опыт и развитие", "words": [{"en": "experience", "ru": "опыт", "icon": "★", "type": "general"}, {"en": "improve", "ru": "улучшать", "icon": "↗", "type": "general"}, {"en": "keyframe", "ru": "ключевой кадр", "icon": "◇", "type": "editing"}, {"en": "masking", "ru": "маскирование", "icon": "◐", "type": "editing"}], "phrase": "Now I feel more comfortable.", "gpt": true}, {"day": 7, "title": "Повторяем спокойно", "words": [{"en": "recognize", "ru": "узнавать", "icon": "◉", "type": "general"}, {"en": "accurate", "ru": "точный", "icon": "⌁", "type": "general"}, {"en": "render", "ru": "рендерить", "icon": "◔", "type": "editing"}, {"en": "export", "ru": "экспортировать", "icon": "⇧", "type": "editing"}], "phrase": "This sounds more natural.", "gpt": false}, {"day": 8, "title": "Мнение и стиль", "words": [{"en": "suggest", "ru": "предлагать", "icon": "✦", "type": "general"}, {"en": "compare", "ru": "сравнивать", "icon": "⇆", "type": "general"}, {"en": "contrast", "ru": "контраст", "icon": "◒", "type": "editing"}, {"en": "saturation", "ru": "насыщенность", "icon": "●", "type": "editing"}], "phrase": "From my point of view...", "gpt": false}, {"day": 9, "title": "Проблемы и решения", "words": [{"en": "issue", "ru": "проблема", "icon": "!", "type": "general"}, {"en": "solution", "ru": "решение", "icon": "✣", "type": "general"}, {"en": "audio levels", "ru": "уровни звука", "icon": "≋", "type": "editing"}, {"en": "noise reduction", "ru": "шумоподавление", "icon": "≈", "type": "editing"}], "phrase": "I'm looking into it.", "gpt": true}, {"day": 10, "title": "Reels и внимание", "words": [{"en": "attention", "ru": "внимание", "icon": "▷", "type": "general"}, {"en": "relevant", "ru": "актуальный", "icon": "⌖", "type": "general"}, {"en": "hook", "ru": "зацепка в начале", "icon": "J", "type": "editing"}, {"en": "engagement", "ru": "вовлечённость", "icon": "♡", "type": "editing"}], "phrase": "The first three seconds are crucial.", "gpt": false}, {"day": 11, "title": "Визуальный язык", "words": [{"en": "subtle", "ru": "ненавязчивый", "icon": "⌁", "type": "general"}, {"en": "dynamic", "ru": "динамичный", "icon": "»", "type": "general"}, {"en": "color grading", "ru": "цветокоррекция", "icon": "◑", "type": "editing"}, {"en": "white balance", "ru": "баланс белого", "icon": "⚖", "type": "editing"}], "phrase": "I'd make it more subtle.", "gpt": false}, {"day": 12, "title": "Переговоры", "words": [{"en": "reasonable", "ru": "разумный", "icon": "✓", "type": "general"}, {"en": "available", "ru": "доступный", "icon": "◷", "type": "general"}, {"en": "deliverables", "ru": "результаты работы", "icon": "□", "type": "editing"}, {"en": "requirements", "ru": "требования", "icon": "☷", "type": "editing"}], "phrase": "Could we adjust the deadline?", "gpt": true}, {"day": 13, "title": "История в видео", "words": [{"en": "context", "ru": "контекст", "icon": "⋯", "type": "general"}, {"en": "emotion", "ru": "эмоция", "icon": "☺", "type": "general"}, {"en": "b-roll", "ru": "дополнительные кадры", "icon": "▣", "type": "editing"}, {"en": "close-up", "ru": "крупный план", "icon": "◉", "type": "editing"}], "phrase": "This scene builds emotion.", "gpt": false}, {"day": 14, "title": "Финальный день", "words": [{"en": "express", "ru": "выражать", "icon": "◌", "type": "general"}, {"en": "continue", "ru": "продолжать", "icon": "→", "type": "general"}, {"en": "final version", "ru": "финальная версия", "icon": "✓", "type": "editing"}, {"en": "reference", "ru": "референс", "icon": "▤", "type": "editing"}], "phrase": "My next goal is...", "gpt": true}], nav=document.getElementById('days'), box=document.getElementById('lessons'), state={};
const key=(d,k)=>`tanya-v5-${d}-${k}`;
function speak(t){let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}
function setDay(d){document.querySelectorAll('.lesson,.daybtn').forEach(x=>x.classList.remove('active'));document.getElementById('lesson'+d).classList.add('active');document.querySelector(`[data-day="${d}"]`).classList.add('active');document.getElementById('dayTitle').textContent='День '+d;scrollTo({top:0,behavior:'smooth'})}
DAYS.forEach((d,di)=>{let b=document.createElement('button');b.className='daybtn '+(di?'':'active');b.dataset.day=d.day;b.innerHTML=`<b>День ${d.day}</b><small>${d.title}</small>`;b.onclick=()=>setDay(d.day);nav.appendChild(b);
let a=document.createElement('article');a.className='lesson '+(di?'':'active');a.id='lesson'+d.day;
let steps=d.words.map((w,i)=>`<section class="step ${i?'':'active'}" data-step="${i}"><div class="card wordcard"><div><div class="dots">${d.words.map((_,j)=>`<span class="dot ${j===i?'active':''}"></span>`).join('')}</div><div class="sticker">${w.icon}</div><div class="en">${w.en} <button class="install" onclick='speak(${JSON.stringify(w.en)})'>🔊</button></div><div class="ru">${w.ru}</div><div class="example"><b>${w.type==='editing'?'This word is useful for video editing.':'This word is useful in everyday English.'}</b></div></div><div class="buttons"><button class="unknown" onclick="mark(${d.day},${i},false)">Не знаю</button><button class="secondary" onclick="mark(${d.day},${i},true)">Я знаю ✓</button></div></div></section>`).join('');
let phrase=`<section class="phrase"><div class="card wordcard"><div><div class="sticker">💬</div><div class="muted">Фраза дня</div><div class="phrasebox">${d.phrase}</div></div><button class="primary" onclick="startQuiz(${d.day})">Перейти к тесту →</button></div></section>`;
let quiz=`<section class="quiz"><div class="card"><div class="meta"><h2>Мини-тест</h2><span class="pill" id="counter${d.day}">1 из 5</span></div><div id="quiz${d.day}"></div></div></section>`;
let finish=`<section class="finish"><div class="card"><div class="check">✓</div><h2>День завершён</h2><p class="muted">4 слова, фраза и мини-тест готовы.</p>${d.gpt?`<button class="primary" onclick="showGPT(${d.day})">Практика с GPT</button>`:''}<button class="secondary" onclick="nextDay(${d.day})">Следующий день →</button></div></section>`;
let gpt=`<section class="gpt"><div class="card"><h2>Практика с GPT</h2><p>Поговори 5 минут по теме дня. В конце попроси выписать слова, которых тебе не хватило.</p><button class="primary" onclick="copyPrompt(${d.day})">Скопировать фразу</button></div></section>`;
a.innerHTML=steps+phrase+quiz+finish+gpt;box.appendChild(a);state[d.day]={quiz:[],i:0,score:0};});
function mark(day,i,known){if(!known){let r=JSON.parse(localStorage.getItem('tanya-v5-review')||'[]'),w=DAYS[day-1].words[i];if(!r.some(x=>x.en===w.en))r.push(w);localStorage.setItem('tanya-v5-review',JSON.stringify(r))}let l=document.getElementById('lesson'+day);l.querySelectorAll('.step').forEach(x=>x.classList.remove('active'));if(i<3)l.querySelector(`[data-step="${i+1}"]`).classList.add('active');else l.querySelector('.phrase').classList.add('active')}
function buildQuiz(day){let d=DAYS[day-1],pool=DAYS.flatMap(x=>x.words),q=d.words.map(w=>{let wrong=pool.filter(x=>x.en!==w.en).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.ru);return {w,answer:w.ru,opts:[w.ru,...wrong].sort(()=>Math.random()-.5)}});q.push({w:{en:d.phrase,ru:'Фраза дня',icon:'💬'},answer:'Это фраза дня',opts:['Это фраза дня','Это эффект','Это формат','Это команда']});return q.sort(()=>Math.random()-.5)}
function startQuiz(day){let l=document.getElementById('lesson'+day);l.querySelector('.phrase').classList.remove('active');l.querySelector('.quiz').classList.add('active');state[day]={quiz:buildQuiz(day),i:0,score:0};renderQ(day)}
function renderQ(day){let s=state[day],q=s.quiz[s.i];document.getElementById('counter'+day).textContent=(s.i+1)+' из 5';document.getElementById('quiz'+day).innerHTML=`<div class="sticker">${q.w.icon}</div><div class="qtitle">Что означает “${q.w.en}”?</div><div class="options">${q.opts.map(o=>`<button class="opt" onclick='answer(${day},${JSON.stringify(o)})'>${o}</button>`).join('')}<button class="opt" onclick="answer(${day},'__unknown__')">Не знаю</button></div><div id="res${day}"></div>`}
function answer(day,a){let s=state[day],q=s.quiz[s.i];document.querySelectorAll(`#quiz${day} .opt`).forEach(b=>{b.disabled=true;if(b.textContent===q.answer)b.classList.add('correct');if(a!=='__unknown__'&&b.textContent===a&&a!==q.answer)b.classList.add('wrong')});if(a===q.answer)s.score++;else if(q.w.ru!=='Фраза дня'){let r=JSON.parse(localStorage.getItem('tanya-v5-review')||'[]');if(!r.some(x=>x.en===q.w.en))r.push(q.w);localStorage.setItem('tanya-v5-review',JSON.stringify(r))}document.getElementById('res'+day).innerHTML=`<p><b>${a===q.answer?'Правильно ✓':'Правильный ответ: '+q.answer}</b></p><button class="primary" onclick="nextQ(${day})">Далее →</button>`}
function nextQ(day){let s=state[day];s.i++;if(s.i<s.quiz.length)renderQ(day);else finish(day)}
function finish(day){let l=document.getElementById('lesson'+day);l.querySelector('.quiz').classList.remove('active');l.querySelector('.finish').classList.add('active');localStorage.setItem(key(day,'done'),'1');update()}
function update(){let n=DAYS.filter(d=>localStorage.getItem(key(d.day,'done'))==='1').length,p=Math.round(n/14*100);document.getElementById('pct').textContent=p+'%';document.getElementById('bar').style.width=p+'%';document.querySelectorAll('.daybtn').forEach((b,i)=>b.classList.toggle('done',localStorage.getItem(key(i+1,'done'))==='1'))}update();
function nextDay(d){if(d<14)setDay(d+1)}function showGPT(d){let l=document.getElementById('lesson'+d);l.querySelector('.finish').classList.remove('active');l.querySelector('.gpt').classList.add('active')}function copyPrompt(d){navigator.clipboard?.writeText(`Давай практиковать английский. День ${d}. Не исправляй меня сразу. В конце выпиши слова, которых мне не хватило.`);alert('Фраза скопирована')}
let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});document.getElementById('install').onclick=async()=>{if(!deferredPrompt)return alert('На iPhone: Поделиться → На экран «Домой».');deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');
</script></body></html>

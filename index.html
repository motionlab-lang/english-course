<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6f56d9">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>English with Tanya</title>
<style>
:root{--bg:#f5f3fb;--card:#fff;--text:#241f33;--muted:#756e87;--p:#6f56d9;--soft:#ece7ff;--line:#e5dff0;--ok:#2f9b68;--bad:#c65d5d;--shadow:0 16px 42px #3d2c6a14}
[data-theme=dark]{--bg:#15121d;--card:#211c2c;--text:#f5f1ff;--muted:#b9afca;--p:#9b84ef;--soft:#332b47;--line:#3a334b;--ok:#5ed39a;--bad:#ff8c8c;--shadow:0 18px 46px #0005}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:linear-gradient(#eae4ff,var(--bg) 390px);color:var(--text);min-height:100vh}[data-theme=dark] body{background:linear-gradient(#261e3e,var(--bg) 390px)}
.app{max-width:980px;margin:auto;padding:18px 14px 70px}.hero,.card,.progress{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.hero{padding:26px;position:relative}.tag{display:inline-block;background:var(--soft);color:var(--p);padding:7px 11px;border-radius:99px;font-weight:900}h1{font-size:clamp(35px,8vw,58px);line-height:1;margin:12px 0}.muted,.hero p{color:var(--muted);line-height:1.5}.tools{position:absolute;right:18px;top:18px;display:flex;gap:8px}.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;width:42px;height:42px}
.progress{padding:16px;margin-top:14px;position:sticky;top:7px;z-index:5}.pt{display:flex;justify-content:space-between;font-weight:900;margin-bottom:9px}.track{height:12px;background:var(--soft);border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--p),#bbaaff)}
.layout{display:grid;grid-template-columns:235px 1fr;gap:16px;margin-top:16px}.nav{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:10px;height:fit-content;position:sticky;top:93px}.nav button{width:100%;border:0;background:none;color:var(--text);text-align:left;padding:11px;border-radius:13px;cursor:pointer}.nav button.active{background:var(--p);color:white}.nav button.done:after{content:"✓";float:right}.nav small{display:block;opacity:.72}
.lesson{display:none}.lesson.active{display:block}.card{padding:20px;margin-bottom:14px}h2{font-size:32px;margin:4px 0 10px}h3{margin-top:0}.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--p);font-weight:950;margin:18px 0 8px}
.words{display:grid;grid-template-columns:1fr 1fr;gap:9px}.word{padding:14px;border:1px solid var(--line);border-radius:15px;background:color-mix(in srgb,var(--card) 94%,var(--soft));position:relative}.en{font-size:20px;font-weight:950;padding-right:35px}.ru{color:var(--muted);margin-top:4px}.say{position:absolute;right:8px;top:8px;border:0;background:var(--soft);color:var(--text);border-radius:9px;padding:7px}
.phrase{padding:12px 14px;background:color-mix(in srgb,var(--card) 92%,var(--soft));border-left:4px solid var(--p);border-radius:12px;margin:8px 0;font-weight:800}
textarea{width:100%;min-height:110px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:13px;padding:13px;resize:vertical}button.main{border:0;background:var(--p);color:white;padding:12px 15px;border-radius:12px;font-weight:900;cursor:pointer;margin-top:10px}button.alt{border:1px solid var(--line);background:var(--card);color:var(--text);padding:11px 14px;border-radius:12px;font-weight:800;cursor:pointer}
.quiz-q{padding:14px;border:1px solid var(--line);border-radius:15px;margin:11px 0}.options{display:grid;gap:8px;margin-top:10px}.opt{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--text);padding:11px;border-radius:11px;cursor:pointer}.opt.sel{outline:2px solid var(--p)}.opt.correct{background:color-mix(in srgb,var(--ok) 18%,var(--card));border-color:var(--ok)}.opt.wrong{background:color-mix(in srgb,var(--bad) 16%,var(--card));border-color:var(--bad)}.opt.unknown{border-style:dashed;color:var(--muted)}
.result{font-size:19px;font-weight:950;margin-top:12px}.donebox{display:flex;gap:10px;align-items:center;padding:15px;background:color-mix(in srgb,var(--ok) 12%,var(--card));border:1px solid color-mix(in srgb,var(--ok) 30%,var(--line));border-radius:15px;font-weight:900}.donebox.locked{opacity:.55}.donebox input{width:20px;height:20px}
.gpt{background:linear-gradient(135deg,#28223b,#6f56d9);color:white}.gpt p{color:#ffffffcf}
.review-box{display:none}.review-box.show{display:block}
@media(max-width:760px){.layout{grid-template-columns:1fr}.nav{position:static;display:flex;gap:7px;overflow:auto}.nav button{min-width:105px}.words{grid-template-columns:1fr}.progress{position:static}.tools{position:static;margin-top:14px}}
</style>
</head>
<body><main class="app">
<section class="hero"><span class="tag">14-дневный курс · A2 → B1</span><h1>English with Tanya</h1><p>Каждый день: 4 общих слова, 4 слова по монтажу, фразы, мини-тест и практика.</p><div class="tools"><button class="iconbtn" id="theme">🌙</button><button class="iconbtn" id="install">⬇️</button></div></section>
<section class="progress"><div class="pt"><span>Прогресс курса</span><span id="count">0 из 14 дней</span></div><div class="track"><div class="bar" id="bar"></div></div></section>
<div class="layout"><nav class="nav" id="nav"></nav><section id="lessons"></section></div>
<div class="card review-box" id="reviewBox"><h2>Слова на повторение</h2><div id="reviewWords" class="words"></div></div>
</main>
<script>
const DAYS=[{"day": 1, "general": [["actually", "на самом деле"], ["probably", "вероятно"], ["especially", "особенно"], ["however", "однако"]], "editing": [["timeline", "таймлайн"], ["footage", "исходный материал"], ["sequence", "последовательность кадров"], ["transition", "переход"]], "phrases": ["To be honest...", "It depends on the situation.", "That’s exactly what I mean."], "task": "Расскажи, почему ты хочешь улучшить английский.", "gpt": false}, {"day": 2, "general": [["instead", "вместо этого"], ["although", "хотя"], ["improve", "улучшать"], ["achieve", "достигать"]], "editing": [["overlay", "наложение"], ["caption", "подпись"], ["subtitle", "субтитр"], ["voice-over", "закадровый голос"]], "phrases": ["The pacing feels too slow.", "This shot works better.", "Let’s keep this version."], "task": "Опиши ролик, который ты сейчас монтируешь.", "gpt": false}, {"day": 3, "general": [["suggest", "предлагать"], ["explain", "объяснять"], ["compare", "сравнивать"], ["realize", "осознавать"]], "editing": [["frame", "кадр"], ["trim", "обрезать"], ["split", "разделить"], ["merge", "объединить"]], "phrases": ["The deadline is quite tight.", "Everything is on schedule.", "I need a little more time."], "task": "Объясни клиенту, когда будет готов проект.", "gpt": true}, {"day": 4, "general": [["manage", "справляться"], ["consider", "рассматривать"], ["confident", "уверенный"], ["comfortable", "комфортный"]], "editing": [["crop", "кадрировать"], ["resize", "изменить размер"], ["zoom", "масштабировать"], ["stabilize", "стабилизировать"]], "phrases": ["Could you clarify this part?", "I can make that change.", "I’ll update it and send it back."], "task": "Ответь клиенту, который просит заменить музыку.", "gpt": false}, {"day": 5, "general": [["opportunity", "возможность"], ["experience", "опыт"], ["available", "доступный"], ["possible", "возможный"]], "editing": [["keyframe", "ключевой кадр"], ["masking", "маскирование"], ["motion graphics", "моушн-графика"], ["render", "рендерить"]], "phrases": ["From my point of view...", "This works better because...", "I’d recommend..."], "task": "Объясни, почему выбрала именно такой монтаж.", "gpt": false}, {"day": 6, "general": [["challenge", "сложность"], ["effective", "эффективный"], ["appropriate", "подходящий"], ["specific", "конкретный"]], "editing": [["export", "экспортировать"], ["bitrate", "битрейт"], ["frame rate", "частота кадров"], ["aspect ratio", "соотношение сторон"]], "phrases": ["I used to find it difficult.", "Now I feel more comfortable.", "I’ve learned a lot from this."], "task": "Расскажи, как ты начала заниматься монтажом.", "gpt": true}, {"day": 7, "general": [["recommend", "рекомендовать"], ["avoid", "избегать"], ["develop", "развивать"], ["independent", "самостоятельный"]], "editing": [["color grading", "стилистическая цветокоррекция"], ["color correction", "техническая цветокоррекция"], ["exposure", "экспозиция"], ["saturation", "насыщенность"]], "phrases": ["I know what it means, but...", "I need more time to answer.", "This sounds more natural."], "task": "Подведи итог первой недели.", "gpt": false}, {"day": 8, "general": [["eventually", "в конце концов"], ["recently", "недавно"], ["meanwhile", "тем временем"], ["definitely", "определённо"]], "editing": [["contrast", "контраст"], ["highlights", "светлые участки"], ["shadows", "тени"], ["white balance", "баланс белого"]], "phrases": ["I’d rather...", "I partly agree, but...", "Another option would be..."], "task": "Сравни два варианта ролика.", "gpt": false}, {"day": 9, "general": [["perhaps", "возможно"], ["despite", "несмотря на"], ["unless", "если не"], ["reliable", "надёжный"]], "editing": [["background music", "фоновая музыка"], ["sound effects", "звуковые эффекты"], ["audio levels", "уровни звука"], ["noise reduction", "шумоподавление"]], "phrases": ["There seems to be a problem with...", "I’m looking into it.", "This should solve the issue."], "task": "Сообщи клиенту о технической проблеме.", "gpt": true}, {"day": 10, "general": [["flexible", "гибкий"], ["reasonable", "разумный"], ["accurate", "точный"], ["notice", "замечать"]], "editing": [["fade in", "плавное появление"], ["fade out", "плавное затухание"], ["mute", "отключить звук"], ["hook", "зацепка в начале"]], "phrases": ["The first three seconds are crucial.", "This should attract more attention.", "The style needs to be consistent."], "task": "Предложи идею для нового Reels.", "gpt": false}, {"day": 11, "general": [["mention", "упоминать"], ["admit", "признавать"], ["expect", "ожидать"], ["require", "требовать"]], "editing": [["retention", "удержание аудитории"], ["engagement", "вовлечённость"], ["thumbnail", "обложка"], ["algorithm", "алгоритм"]], "phrases": ["The overall style feels...", "I’d make it more subtle.", "The visuals support the message."], "task": "Опиши визуальный стиль клипа.", "gpt": false}, {"day": 12, "general": [["involve", "включать в себя"], ["depend", "зависеть"], ["prefer", "предпочитать"], ["respond", "отвечать"]], "editing": [["viral", "вирусный"], ["trending", "трендовый"], ["reach", "охват"], ["watch time", "время просмотра"]], "phrases": ["That’s outside the original scope.", "Could we adjust the deadline?", "Please confirm the final details."], "task": "Клиент просит лишние правки бесплатно.", "gpt": true}, {"day": 13, "general": [["continue", "продолжать"], ["decision", "решение"], ["result", "результат"], ["purpose", "цель"]], "editing": [["revision", "правка"], ["feedback", "обратная связь"], ["deadline", "срок сдачи"], ["draft", "черновик"]], "phrases": ["The story begins with...", "This scene builds emotion.", "The ending leaves a strong impression."], "task": "Кратко перескажи сюжет видео.", "gpt": false}, {"day": 14, "general": [["progress", "прогресс"], ["support", "поддерживать"], ["solution", "решение"], ["issue", "проблема"]], "editing": [["final version", "финальная версия"], ["deliverables", "результаты работы"], ["requirements", "требования"], ["reference", "референс"]], "phrases": ["I’ve become better at...", "I still need to improve...", "My next goal is..."], "task": "Расскажи, чему научилась за 14 дней.", "gpt": true}];
const nav=document.getElementById('nav'),lessons=document.getElementById('lessons');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const quizState={};
function speak(t){let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}
function allWords(){return DAYS.flatMap(d=>[...d.general,...d.editing])}
function makeQuiz(d){let pool=[...d.general,...d.editing];return pool.map((w,i)=>{let others=allWords().filter(x=>x[0]!==w[0]).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[1]);return {word:w[0],answer:w[1],options:[w[1],...others].sort(()=>Math.random()-.5)}})}
DAYS.forEach((d,i)=>{
 const b=document.createElement('button');b.dataset.day=d.day;b.className=i?'':'active';b.innerHTML=`<b>День ${d.day}</b><small>${d.gpt?'Есть практика с GPT':'8 слов + тест'}</small>`;nav.appendChild(b);
 const a=document.createElement('article');a.className='lesson '+(i?'':'active');a.id='day'+d.day;
 const gw=d.general.map(w=>`<div class="word"><button class="say" onclick='speak(${JSON.stringify(w[0])})'>🔊</button><div class="en">${esc(w[0])}</div><div class="ru">${esc(w[1])}</div></div>`).join('');
 const ew=d.editing.map(w=>`<div class="word"><button class="say" onclick='speak(${JSON.stringify(w[0])})'>🔊</button><div class="en">${esc(w[0])}</div><div class="ru">${esc(w[1])}</div></div>`).join('');
 const ph=d.phrases.map(p=>`<div class="phrase">${esc(p)}</div>`).join('');
 const g=d.gpt?`<div class="card gpt"><h3>Практика с GPT</h3><p>Поговори 5–10 минут. Скажи: «Давай практиковать английский. День ${d.day}. Не исправляй меня сразу, а в конце собери слова, которых мне не хватало».</p></div>`:'';
 a.innerHTML=`<div class="card"><h2>День ${d.day}</h2><div class="section-title">Общие слова</div><div class="words">${gw}</div><div class="section-title">Монтаж</div><div class="words">${ew}</div></div>
 <div class="card"><h3>Разговорные фразы</h3>${ph}</div>
 <div class="card"><h3>Задание</h3><p><b>${esc(d.task)}</b></p><textarea id="answer${d.day}" placeholder="Напиши ответ по-английски..."></textarea><button class="main" onclick="saveAnswer(${d.day})">Сохранить</button><div id="saved${d.day}"></div></div>${g}
 <div class="card"><h3>Мини-тест</h3><p class="muted">Нужно набрать минимум 7 из 8. «Не знаю» отправляет слово в повторение.</p><div id="quiz${d.day}"></div><button class="main" onclick="checkQuiz(${d.day})">Проверить</button><div class="result" id="result${d.day}"></div></div>
 <label class="donebox locked" id="doneLabel${d.day}"><input type="checkbox" data-day="${d.day}" disabled>Я закончила этот день</label>`;
 lessons.appendChild(a);
 renderQuiz(d.day);
});
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button,.lesson').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('day'+b.dataset.day).classList.add('active');scrollTo({top:0,behavior:'smooth'})});
function renderQuiz(day){const d=DAYS.find(x=>x.day===day),qs=makeQuiz(d);quizState[day]={qs,answers:{}};document.getElementById('quiz'+day).innerHTML=qs.map((q,i)=>`<div class="quiz-q" data-q="${i}"><b>${i+1}. Что значит “${q.word}”?</b><div class="options">${q.options.map(o=>`<button class="opt" onclick='choose(${day},${i},${JSON.stringify(o)})'>${esc(o)}</button>`).join('')}<button class="opt unknown" onclick="choose(${day},${i},'__unknown__')">Не знаю</button></div></div>`).join('')}
function choose(day,i,o){quizState[day].answers[i]=o;let q=document.querySelector(`#quiz${day} .quiz-q[data-q="${i}"]`);q.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',(o==='__unknown__'&&b.textContent==='Не знаю')||b.textContent===o))}
function getReview(){return JSON.parse(localStorage.getItem('tanya-v4-review')||'{}')}
function setReview(r){localStorage.setItem('tanya-v4-review',JSON.stringify(r));renderReview()}
function checkQuiz(day){let s=quizState[day],score=0,r=getReview();s.qs.forEach((q,i)=>{let a=s.answers[i],node=document.querySelector(`#quiz${day} .quiz-q[data-q="${i}"]`);node.querySelectorAll('.opt').forEach(b=>{b.classList.remove('correct','wrong');if(b.textContent===q.answer)b.classList.add('correct');if(a!=='__unknown__'&&b.textContent===a&&a!==q.answer)b.classList.add('wrong')});if(a===q.answer){score++;if(r[q.word])r[q.word]=Math.max(0,r[q.word]-1)}else{r[q.word]=(r[q.word]||0)+1}});setReview(r);let pass=score>=7;localStorage.setItem('tanya-v4-quiz-'+day,pass?'1':'0');document.getElementById('result'+day).textContent=`Результат: ${score} из 8 ${pass?'— тест пройден ✓':'— нужно минимум 7'}`;unlock(day,pass)}
function unlock(day,pass){let c=document.querySelector(`.donebox input[data-day="${day}"]`),l=document.getElementById('doneLabel'+day);c.disabled=!pass;l.classList.toggle('locked',!pass)}
function saveAnswer(day){let t=document.getElementById('answer'+day);localStorage.setItem('tanya-v4-answer-'+day,t.value);document.getElementById('saved'+day).textContent='Ответ сохранён ✓'}
DAYS.forEach(d=>{document.getElementById('answer'+d.day).value=localStorage.getItem('tanya-v4-answer-'+d.day)||'';unlock(d.day,localStorage.getItem('tanya-v4-quiz-'+d.day)==='1')});
document.querySelectorAll('.donebox input').forEach(c=>{c.checked=localStorage.getItem('tanya-v4-done-'+c.dataset.day)==='1';c.onchange=()=>{localStorage.setItem('tanya-v4-done-'+c.dataset.day,c.checked?'1':'0');progress()}});
function progress(){let checks=[...document.querySelectorAll('.donebox input')],n=checks.filter(x=>x.checked).length;document.getElementById('count').textContent=n+' из 14 дней';document.getElementById('bar').style.width=n/14*100+'%';document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('done',checks[i].checked))}progress();
function renderReview(){let r=getReview(),all=allWords(),arr=Object.entries(r).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);let box=document.getElementById('reviewBox');box.classList.toggle('show',arr.length>0);document.getElementById('reviewWords').innerHTML=arr.map(([k,c])=>{let w=all.find(x=>x[0]===k);return w?`<div class="word"><div class="en">${w[0]}</div><div class="ru">${w[1]}</div><div class="muted">Повторить: ${c}</div></div>`:''}).join('')}renderReview();
const theme=document.getElementById('theme'),saved=localStorage.getItem('tanya-theme')||'light';document.documentElement.dataset.theme=saved;theme.textContent=saved==='dark'?'☀️':'🌙';theme.onclick=()=>{let t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('tanya-theme',t);theme.textContent=t==='dark'?'☀️':'🌙'};
let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});document.getElementById('install').onclick=async()=>{if(!deferredPrompt)return alert('На iPhone: Поделиться → На экран «Домой».');deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');
</script></body></html>

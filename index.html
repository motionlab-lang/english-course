<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6f56d9"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>English with Tanya</title>
<style>
:root{--bg:#f5f3fb;--card:#fff;--text:#241f33;--muted:#756e87;--p:#6f56d9;--soft:#ece7ff;--line:#e5dff0;--ok:#2f9b68;--bad:#c65d5d;--shadow:0 16px 42px #3d2c6a14}
[data-theme=dark]{--bg:#15121d;--card:#211c2c;--text:#f5f1ff;--muted:#b9afca;--p:#9b84ef;--soft:#332b47;--line:#3a334b;--ok:#5ed39a;--bad:#ff8c8c;--shadow:0 18px 46px #0005}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:linear-gradient(#eae4ff,var(--bg) 390px);color:var(--text);min-height:100vh}
[data-theme=dark] body{background:linear-gradient(#261e3e,var(--bg) 390px)}
.app{max-width:760px;margin:auto;padding:18px 14px 72px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.hero{padding:24px;position:relative}
.tag{display:inline-block;background:var(--soft);color:var(--p);padding:7px 11px;border-radius:99px;font-weight:900}h1{font-size:clamp(34px,8vw,56px);line-height:1;margin:12px 0}.muted,.hero p{color:var(--muted);line-height:1.5}.theme{position:absolute;right:16px;top:16px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;width:42px;height:42px}
.card{padding:20px;margin-top:14px}.progressline{height:12px;background:var(--soft);border-radius:99px;overflow:hidden;margin:10px 0 4px}.bar{height:100%;background:linear-gradient(90deg,var(--p),#bbaaff);width:0}
.step{display:none}.step.active{display:block}.word-card{text-align:center;padding:36px 18px}.word-en{font-size:38px;font-weight:950}.word-ru{font-size:20px;color:var(--muted);margin-top:8px}.counter{font-weight:900;color:var(--p)}
button.main{width:100%;border:0;background:var(--p);color:white;padding:14px;border-radius:14px;font-weight:950;font-size:16px;margin-top:14px}button.alt{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);padding:13px;border-radius:13px;font-weight:850;margin-top:9px}
.question{padding:16px;border:1px solid var(--line);border-radius:15px;margin:12px 0}.options{display:grid;gap:8px;margin-top:11px}.opt{border:1px solid var(--line);background:var(--card);color:var(--text);padding:12px;border-radius:12px;text-align:left}.opt.selected{outline:2px solid var(--p)}.opt.correct{background:color-mix(in srgb,var(--ok) 18%,var(--card));border-color:var(--ok)}.opt.wrong{background:color-mix(in srgb,var(--bad) 16%,var(--card));border-color:var(--bad)}
input[type=text]{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);padding:13px;border-radius:12px;margin-top:9px}.feedback{font-weight:900;margin-top:10px}.locked{opacity:.55;pointer-events:none}.success{text-align:center;padding:32px 18px}.success h2{font-size:32px}.gpt{background:linear-gradient(135deg,#28223b,#6f56d9);color:white}.gpt p{color:#ffffffcf}.hidden{display:none}
</style>
</head>
<body><main class="app">
<section class="hero"><span class="tag">Логичный курс · 14 дней</span><h1>English with Tanya</h1><p>Один урок за раз. День завершается только после всех правильных ответов.</p><button class="theme" id="theme">🌙</button></section>
<section class="card">
<div><b id="dayTitle">День 1 из 14</b><span style="float:right" id="courseCount">0/14</span></div>
<div class="progressline"><div class="bar" id="courseBar"></div></div>
</section>
<section id="lesson"></section>
</main>
<script>
const DAYS=[{"day": 1, "words": [["actually", "на самом деле"], ["probably", "вероятно"], ["especially", "особенно"], ["however", "однако"], ["timeline", "таймлайн"], ["footage", "исходный материал"], ["sequence", "последовательность кадров"], ["transition", "переход"]], "example": "I actually prefer this version.", "gpt": false}, {"day": 2, "words": [["instead", "вместо этого"], ["although", "хотя"], ["improve", "улучшать"], ["achieve", "достигать"], ["overlay", "наложение"], ["caption", "подпись"], ["subtitle", "субтитр"], ["voice-over", "закадровый голос"]], "example": "The footage needs a smoother transition.", "gpt": false}, {"day": 3, "words": [["suggest", "предлагать"], ["explain", "объяснять"], ["compare", "сравнивать"], ["realize", "осознавать"], ["frame", "кадр"], ["trim", "обрезать"], ["split", "разделить"], ["merge", "объединить"]], "example": "The deadline is quite tight.", "gpt": true}, {"day": 4, "words": [["manage", "справляться"], ["consider", "рассматривать"], ["confident", "уверенный"], ["comfortable", "комфортный"], ["crop", "кадрировать"], ["resize", "изменить размер"], ["zoom", "масштабировать"], ["stabilize", "стабилизировать"]], "example": "Could you clarify this revision?", "gpt": false}, {"day": 5, "words": [["opportunity", "возможность"], ["experience", "опыт"], ["available", "доступный"], ["possible", "возможный"], ["keyframe", "ключевой кадр"], ["masking", "маскирование"], ["motion graphics", "моушн-графика"], ["render", "рендерить"]], "example": "This approach is more effective.", "gpt": false}, {"day": 6, "words": [["challenge", "сложность"], ["effective", "эффективный"], ["appropriate", "подходящий"], ["specific", "конкретный"], ["export", "экспортировать"], ["bitrate", "битрейт"], ["frame rate", "частота кадров"], ["aspect ratio", "соотношение сторон"]], "example": "I feel more confident now.", "gpt": true}, {"day": 7, "words": [["recommend", "рекомендовать"], ["avoid", "избегать"], ["develop", "развивать"], ["independent", "самостоятельный"], ["color grading", "стилистическая цветокоррекция"], ["color correction", "техническая цветокоррекция"], ["exposure", "экспозиция"], ["saturation", "насыщенность"]], "example": "I need to review these words.", "gpt": false}, {"day": 8, "words": [["eventually", "в конце концов"], ["recently", "недавно"], ["meanwhile", "тем временем"], ["definitely", "определённо"], ["contrast", "контраст"], ["highlights", "светлые участки"], ["shadows", "тени"], ["white balance", "баланс белого"]], "example": "I would recommend another option.", "gpt": false}, {"day": 9, "words": [["perhaps", "возможно"], ["despite", "несмотря на"], ["unless", "если не"], ["reliable", "надёжный"], ["background music", "фоновая музыка"], ["sound effects", "звуковые эффекты"], ["audio levels", "уровни звука"], ["noise reduction", "шумоподавление"]], "example": "There is an issue with the export.", "gpt": true}, {"day": 10, "words": [["flexible", "гибкий"], ["reasonable", "разумный"], ["accurate", "точный"], ["notice", "замечать"], ["fade in", "плавное появление"], ["fade out", "плавное затухание"], ["mute", "отключить звук"], ["hook", "зацепка в начале"]], "example": "The hook should attract attention.", "gpt": false}, {"day": 11, "words": [["mention", "упоминать"], ["admit", "признавать"], ["expect", "ожидать"], ["require", "требовать"], ["retention", "удержание аудитории"], ["engagement", "вовлечённость"], ["thumbnail", "обложка"], ["algorithm", "алгоритм"]], "example": "The color grading looks more subtle.", "gpt": false}, {"day": 12, "words": [["involve", "включать в себя"], ["depend", "зависеть"], ["prefer", "предпочитать"], ["respond", "отвечать"], ["viral", "вирусный"], ["trending", "трендовый"], ["reach", "охват"], ["watch time", "время просмотра"]], "example": "Please confirm the final deadline.", "gpt": true}, {"day": 13, "words": [["continue", "продолжать"], ["decision", "решение"], ["result", "результат"], ["purpose", "цель"], ["revision", "правка"], ["feedback", "обратная связь"], ["deadline", "срок сдачи"], ["draft", "черновик"]], "example": "The ending creates a stronger emotion.", "gpt": false}, {"day": 14, "words": [["progress", "прогресс"], ["support", "поддерживать"], ["solution", "решение"], ["issue", "проблема"], ["final version", "финальная версия"], ["deliverables", "результаты работы"], ["requirements", "требования"], ["reference", "референс"]], "example": "My next goal is to speak more fluently.", "gpt": true}];
let currentDay=parseInt(localStorage.getItem('tanya-v5-current-day')||'1');
let wordIndex=0, stage='learn', answers={}, spellAnswers={};
const lesson=document.getElementById('lesson');
const allWords=DAYS.flatMap(d=>d.words);

function dayData(){return DAYS[currentDay-1]}
function setCourseProgress(){
 document.getElementById('dayTitle').textContent=`День ${currentDay} из 14`;
 let completed=currentDay-1;
 document.getElementById('courseCount').textContent=`${completed}/14`;
 document.getElementById('courseBar').style.width=(completed/14*100)+'%';
}
function normalize(s){return String(s).toLowerCase().trim().replace(/[.!?,]/g,'').replace(/\s+/g,' ')}
function render(){
 setCourseProgress();
 if(currentDay>14){
  lesson.innerHTML=`<section class="card success"><h2>Курс завершён 🎉</h2><p>Ты правильно прошла все 14 уроков.</p></section>`;return;
 }
 const d=dayData();
 if(stage==='learn'){
  const w=d.words[wordIndex];
  lesson.innerHTML=`<section class="card word-card"><div class="counter">Слово ${wordIndex+1} из 8</div><div class="word-en">${w[0]}</div><div class="word-ru">${w[1]}</div><button class="main" onclick="nextWord()">Понятно, дальше</button></section>`;
 } else if(stage==='choice'){
  const qs=d.words.map((w,i)=>{
   const others=allWords.filter(x=>x[0]!==w[0]).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[1]);
   const options=[w[1],...others].sort(()=>Math.random()-.5);
   return {word:w[0],answer:w[1],options};
  });
  window.choiceQuestions=qs;
  lesson.innerHTML=`<section class="card"><h2>Шаг 2. Выбери перевод</h2><p class="muted">Все 8 ответов должны быть правильными.</p>${qs.map((q,i)=>`<div class="question" data-i="${i}"><b>${i+1}. Что значит “${q.word}”?</b><div class="options">${q.options.map(o=>`<button class="opt" onclick='selectChoice(${i},${JSON.stringify(o)})'>${o}</button>`).join('')}</div></div>`).join('')}<button class="main" onclick="checkChoices()">Проверить</button><div class="feedback" id="choiceFeedback"></div></section>`;
 } else if(stage==='spell'){
  lesson.innerHTML=`<section class="card"><h2>Шаг 3. Напиши слова</h2><p class="muted">Напиши английское слово по переводу. Ошибочные поля нужно исправить.</p>${d.words.map((w,i)=>`<div class="question"><b>${i+1}. ${w[1]}</b><input type="text" id="spell${i}" value="${spellAnswers[i]||''}" placeholder="English word"><div class="feedback" id="spellFeedback${i}"></div></div>`).join('')}<button class="main" onclick="checkSpelling()">Проверить написание</button><div class="feedback" id="spellSummary"></div></section>`;
 } else if(stage==='sentence'){
  lesson.innerHTML=`<section class="card"><h2>Шаг 4. Заполни пропуск</h2><p class="muted">Впиши пропущенное слово точно.</p><div class="question"><b>${d.example.replace(d.words[0][0],'_____')}</b><input type="text" id="sentenceInput" placeholder="Пропущенное слово"><div class="feedback" id="sentenceFeedback"></div></div><button class="main" onclick="checkSentence()">Проверить</button></section>`;
 } else if(stage==='gpt' && d.gpt){
  lesson.innerHTML=`<section class="card gpt"><h2>Практика с GPT</h2><p>Поговори 5–10 минут. После разговора нажми «Практика завершена».</p><p><b>Фраза для начала:</b><br>Давай практиковать английский. День ${currentDay}. Не исправляй меня сразу, а в конце назови слова, которых мне не хватало.</p><button class="main" onclick="finishDay()">Практика завершена</button></section>`;
 } else {
  finishDay();
 }
}
function nextWord(){
 if(wordIndex<7){wordIndex++;render()}else{stage='choice';answers={};render()}
}
function selectChoice(i,o){
 answers[i]=o;
 const q=document.querySelector(`.question[data-i="${i}"]`);
 q.querySelectorAll('.opt').forEach(b=>b.classList.toggle('selected',b.textContent===o));
}
function checkChoices(){
 let allCorrect=true;
 choiceQuestions.forEach((q,i)=>{
  const chosen=answers[i], node=document.querySelector(`.question[data-i="${i}"]`);
  node.querySelectorAll('.opt').forEach(b=>{b.classList.remove('correct','wrong');if(b.textContent===q.answer)b.classList.add('correct');if(chosen===b.textContent&&chosen!==q.answer)b.classList.add('wrong')});
  if(chosen!==q.answer) allCorrect=false;
 });
 const f=document.getElementById('choiceFeedback');
 if(allCorrect){f.textContent='Все правильно ✓';f.style.color='var(--ok)';setTimeout(()=>{stage='spell';render()},600)}
 else{f.textContent='Есть ошибки. Исправь их — без этого дальше нельзя.';f.style.color='var(--bad)'}
}
function checkSpelling(){
 const d=dayData();let allCorrect=true;
 d.words.forEach((w,i)=>{
  const input=document.getElementById('spell'+i);spellAnswers[i]=input.value;
  const ok=normalize(input.value)===normalize(w[0]);
  const f=document.getElementById('spellFeedback'+i);
  f.textContent=ok?'Правильно ✓':'Неправильно. Попробуй ещё раз.';
  f.style.color=ok?'var(--ok)':'var(--bad)';
  input.style.borderColor=ok?'var(--ok)':'var(--bad)';
  if(!ok) allCorrect=false;
 });
 const s=document.getElementById('spellSummary');
 if(allCorrect){s.textContent='Все слова написаны правильно ✓';s.style.color='var(--ok)';setTimeout(()=>{stage='sentence';render()},700)}
 else{s.textContent='Урок не завершён: исправь все слова.';s.style.color='var(--bad)'}
}
function checkSentence(){
 const d=dayData(), expected=d.words[0][0], value=document.getElementById('sentenceInput').value;
 const f=document.getElementById('sentenceFeedback');
 if(normalize(value)===normalize(expected)){
  f.textContent='Правильно ✓';f.style.color='var(--ok)';
  setTimeout(()=>{stage=d.gpt?'gpt':'finish';render()},600);
 } else {
  f.textContent='Неправильно. Урок не завершён — попробуй ещё раз.';f.style.color='var(--bad)';
 }
}
function finishDay(){
 localStorage.setItem('tanya-v5-done-'+currentDay,'1');
 currentDay++;
 localStorage.setItem('tanya-v5-current-day',String(currentDay));
 wordIndex=0;stage='learn';answers={};spellAnswers={};render();
}
const theme=document.getElementById('theme'),saved=localStorage.getItem('tanya-theme')||'light';
document.documentElement.dataset.theme=saved;theme.textContent=saved==='dark'?'☀️':'🌙';
theme.onclick=()=>{let t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('tanya-theme',t);theme.textContent=t==='dark'?'☀️':'🌙'};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');
render();
</script></body></html>
